[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof"
version = "0.1.0"
description = "Evidence-based security patch validation and regression testing for C/C++ in CI/CD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PatchProof team" }]
dependencies = []

[project.scripts]
patchproof = "patchproof.cli:main"

[tool.setuptools.packages.find]
include = ["patchproof*"]
